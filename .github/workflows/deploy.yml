name: Deploy to InfinityFree via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy using GitHub Runner native tools
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: 🚀 Sync to Hosting via lftp
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "
            set ftp:ssl-allow no;
            set net:timeout 20;
            set net:max-retries 3;
            open -u if0_43325536,\"$FTP_PASSWORD\" ftpupload.net;
            mirror --reverse --verbose \
              --exclude-glob .git* \
              --exclude-glob .git*/** \
              --exclude-glob .github/** \
              --exclude-glob database/** \
              --exclude-glob README.md \
              --exclude-glob uploads/resumes/* \
              --exclude-glob uploads/images/* \
              ./ htdocs/
          "
