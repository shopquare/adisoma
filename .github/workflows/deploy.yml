name: Deploy to Production via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hosting Server
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Generate Production Environment Config
        run: |
          cat << 'EOF' > config/env.php
          <?php
          define('DB_HOST', '${{ secrets.DB_HOST }}');
          define('DB_NAME', '${{ secrets.DB_NAME }}');
          define('DB_USER', '${{ secrets.DB_USER }}');
          define('DB_PASS', '${{ secrets.DB_PASS }}');
          define('BASE_URL', '${{ secrets.BASE_URL }}');
          EOF

      - name: 🚀 Sync Files via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
          FTP_TARGET_DIR: ${{ secrets.FTP_TARGET_DIR || 'htdocs/' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -p "$FTP_PORT" -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" << 'EOF'
            set ftp:ssl-allow no
            set net:timeout 20
            set net:max-retries 3
            mirror --reverse --verbose \
              --exclude-glob .git* \
              --exclude-glob .git*/** \
              --exclude-glob .github/** \
              --exclude-glob database/** \
              --exclude-glob README.md \
              --exclude-glob uploads/resumes/* \
              --exclude-glob uploads/images/* \
              ./ "$FTP_TARGET_DIR"
            quit
          EOF
